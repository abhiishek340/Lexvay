spring:
  application:
    name: lexvay
  datasource:
    # The service connects as the application role, which cannot bypass row-level security.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    username: ${LEXVAY_DB_APP_USER:lexvay_app}
    password: ${LEXVAY_DB_APP_PASSWORD:lexvay-app-dev}
  flyway:
    # Migrations run as the schema owner so RLS can be forced on tables the app role does not own.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    user: ${LEXVAY_DB_OWNER_USER:lexvay_owner}
    password: ${LEXVAY_DB_OWNER_PASSWORD:lexvay-owner-dev}
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB
      max-request-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB

lexvay:
  filestore:
    type: ${LEXVAY_FILESTORE:local}      # local | s3
    path: ${LEXVAY_FILESTORE_PATH:./data/files}
    s3-bucket: ${LEXVAY_S3_BUCKET:}
  llm:
    provider: ${LEXVAY_LLM_PROVIDER:fake}     # fake | anthropic
    model: ${LEXVAY_LLM_MODEL:claude-sonnet-5-5}
    effort: ${LEXVAY_LLM_EFFORT:medium}       # low | medium | high | xhigh | max
    max-output-tokens: 16000
    price:                                    # USD per million tokens; used only by the evaluation cost report
      input-per-mtok: ${LEXVAY_LLM_PRICE_INPUT_PER_MTOK:0}
      output-per-mtok: ${LEXVAY_LLM_PRICE_OUTPUT_PER_MTOK:0}
  ratelimit:                              # per instance, per minute (D-092)
    login-per-minute: ${LEXVAY_RATELIMIT_LOGIN_PER_MINUTE:10}
    api-per-minute: ${LEXVAY_RATELIMIT_API_PER_MINUTE:600}
    upload-per-minute: ${LEXVAY_RATELIMIT_UPLOAD_PER_MINUTE:30}
    max-keys: 10000
    idle-expiry: 10m
  matching:
    min-quote-chars: ${LEXVAY_MIN_QUOTE_CHARS:40}
    shortlist-size: 8
  jobs:
    polling-enabled: true
    poll-interval-ms: 1000
    max-attempts: 3

server:
  port: ${LEXVAY_PORT:8080}
  # Behind a load balancer set LEXVAY_FORWARD_HEADERS=native so the client address (rate limits) and the
  # scheme (HSTS, secure cookies) come from the trusted proxy headers (D-093).
  forward-headers-strategy: ${LEXVAY_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${LEXVAY_COOKIE_SECURE:false}

management:
  endpoint:
    health:
      probes:
        enabled: true

---
# Single sign-on (D-090). Roles never come from the provider; see LexvayOidcUserService.
spring:
  config:
    activate:
      on-profile: oidc
  security:
    oauth2:
      client:
        registration:
          lexvay:
            provider: lexvay
            client-id: ${LEXVAY_OIDC_CLIENT_ID}
            client-secret: ${LEXVAY_OIDC_CLIENT_SECRET}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          lexvay:
            issuer-uri: ${LEXVAY_OIDC_ISSUER_URI}
lexvay:
  oidc:
    post-login-url: ${LEXVAY_OIDC_POST_LOGIN_URL:/}

---
# `make seed`: load the fictional demo tenants once, then exit. No job polling.
spring:
  config:
    activate:
      on-profile: seed
server:
  port: 0   # the security configuration needs the servlet runtime; a random port avoids clashing with a running server
lexvay:
  jobs:
    polling-enabled: false
  seed:
    dir: ${LEXVAY_SEED_DIR:../seed}
    demo-password: ${LEXVAY_DEMO_PASSWORD:lexvay-demo}

---
# `make eval`: seed a fresh tenant, run the pipeline, score it against eval/golden.yml, then exit. No job polling.
spring:
  config:
    activate:
      on-profile: eval
server:
  port: 0
lexvay:
  jobs:
    polling-enabled: false
  seed:
    dir: ${LEXVAY_SEED_DIR:../seed}
  eval:
    dir: ${LEXVAY_EVAL_DIR:../eval}
