spring:
  application:
    name: lexvay
  datasource:
    # The service connects as the application role, which cannot bypass row-level security.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    username: ${LEXVAY_DB_APP_USER:lexvay_app}
    password: ${LEXVAY_DB_APP_PASSWORD:lexvay-app-dev}
  flyway:
    # Migrations run as the schema owner so RLS can be forced on tables the app role does not own.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    user: ${LEXVAY_DB_OWNER_USER:lexvay_owner}
    password: ${LEXVAY_DB_OWNER_PASSWORD:lexvay-owner-dev}
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${LEXVAY_SHUTDOWN_GRACE:30s}
  task:
    scheduling:
      shutdown:
        # The job poller's running job finishes before the scheduler stops (D-146).
        await-termination: true
        await-termination-period: ${LEXVAY_SHUTDOWN_GRACE:30s}
  servlet:
    multipart:
      max-file-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB
      max-request-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB

lexvay:
  filestore:
    type: ${LEXVAY_FILESTORE:local}      # local | s3
    path: ${LEXVAY_FILESTORE_PATH:./data/files}
    s3-bucket: ${LEXVAY_S3_BUCKET:}
  llm:
    provider: ${LEXVAY_LLM_PROVIDER:fake}     # fake | anthropic | openai-compatible
    model: ${LEXVAY_LLM_MODEL:}               # anthropic: empty means claude-sonnet-5-5; openai-compatible: required, no default (D-616)
    effort: ${LEXVAY_LLM_EFFORT:medium}       # anthropic only: low | medium | high | xhigh | max
    # openai-compatible only (EV-1, D-616): a server the operator runs, such as llama-server, Ollama, vLLM or LM Studio.
    base-url: ${LEXVAY_LLM_BASE_URL:}         # up to and excluding /chat/completions, for example http://localhost:8089/v1
    api-key: ${LEXVAY_LLM_API_KEY:}           # optional bearer token
    timeout-seconds: ${LEXVAY_LLM_TIMEOUT_SECONDS:120}
    seed: ${LEXVAY_LLM_SEED:}                 # optional integer sent with every request; every request also asks for temperature 0 (D-616)
    allowed-hosts: ${LEXVAY_LLM_ALLOWED_HOSTS:localhost,127.0.0.1,::1}   # a base URL host outside this list fails startup
    fake-scripts: ${LEXVAY_LLM_FAKE_SCRIPTS:}  # fake provider only: comma-separated fake-llm.yml files scripted at startup (D-280)
    max-output-tokens: 16000
    # Spend gate (MODE-1, D-562): a metered provider is refused unless approved, the model has a price below and the
    # month's recorded cost plus the call's largest possible cost stays within the budget. Defaults refuse everything.
    paid-approved: ${LEXVAY_LLM_PAID_APPROVED:false}
    monthly-budget-usd: ${LEXVAY_LLM_MONTHLY_BUDGET_USD:0}
    rates: ${LEXVAY_LLM_RATES:}             # model=inputPerMtok:outputPerMtok, comma separated; the one price table: this gate, GET /assessments/{id}/usage and the evaluation cost report; empty means every cost is unknown
  ratelimit:                              # per instance, per minute (D-092)
    login-per-minute: ${LEXVAY_RATELIMIT_LOGIN_PER_MINUTE:10}
    api-per-minute: ${LEXVAY_RATELIMIT_API_PER_MINUTE:600}
    upload-per-minute: ${LEXVAY_RATELIMIT_UPLOAD_PER_MINUTE:30}
    max-keys: 10000
    idle-expiry: 10m
  security:
    password-hash-concurrency: ${LEXVAY_PASSWORD_HASH_CONCURRENCY:}   # password hashes at once, 32 MiB each (D-407); unset: processors, at least 2
  matching:
    min-quote-chars: ${LEXVAY_MIN_QUOTE_CHARS:40}
    min-ocr-confidence: 80
    shortlist-size: 8
    ranker: ${LEXVAY_MATCHING_RANKER:bm25}   # bm25 | ts_rank (the baseline the evaluation compares against)
  ocr:
    engine: ${LEXVAY_OCR:off}                              # off | tesseract
    tesseract-path: ${LEXVAY_OCR_TESSERACT_PATH:tesseract}
    language: ${LEXVAY_OCR_LANGUAGE:eng}
    max-pages: 200
  jobs:
    polling-enabled: true
    poll-interval-ms: 1000
    max-attempts: 3
  audit:                                  # SEC-3: the sealer that chains audit entries into a tamper-evident trail
    sealing-enabled: true
    seal-interval-ms: ${LEXVAY_AUDIT_SEAL_INTERVAL_MS:2000}
  package:                                # F15: the evidence package ZIP
    max-bytes: ${LEXVAY_PACKAGE_MAX_BYTES:536870912}   # a larger package fails its job (512 MB); the build needs this much free temporary space
  rule-sources:                           # F12: fetch the pages where licensing boards publish rules (D-185)
    enabled: ${LEXVAY_RULE_SOURCES_ENABLED:false}
    poll-interval-ms: ${LEXVAY_RULE_SOURCES_POLL_INTERVAL_MS:300000}
    contact-url: ${LEXVAY_MONITOR_CONTACT_URL:}                                     # RG-2: the User-Agent's contact; required for the scheduler to start (D-566)
    min-host-interval-seconds: ${LEXVAY_SOURCE_MIN_HOST_INTERVAL_SECONDS:30}        # RG-2: least time between two requests to one host, across instances (D-569)

server:
  port: ${LEXVAY_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB
  # Behind a load balancer set LEXVAY_FORWARD_HEADERS=native so the client address (rate limits) and the
  # scheme (HSTS, secure cookies) come from the trusted proxy headers (D-093).
  forward-headers-strategy: ${LEXVAY_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${LEXVAY_COOKIE_SECURE:false}

# Metrics and the full health report are served on their own port, which is never published to users.
# The main port keeps the probe paths /livez and /readyz (D-142).
management:
  server:
    port: ${LEXVAY_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    # Request id for web requests, job id for background work; empty otherwise.
    correlation: "[%X{requestId:-}%X{jobId:-}] "

---
# Production: one JSON object per line in the Elastic Common Schema, with the MDC (requestId, tenantId,
# userId, jobId) as top-level fields.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: lexvay

---
# Single sign-on (D-090). Roles never come from the provider; see LexvayOidcUserService.
spring:
  config:
    activate:
      on-profile: oidc
  security:
    oauth2:
      client:
        registration:
          lexvay:
            provider: lexvay
            client-id: ${LEXVAY_OIDC_CLIENT_ID}
            client-secret: ${LEXVAY_OIDC_CLIENT_SECRET}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          lexvay:
            issuer-uri: ${LEXVAY_OIDC_ISSUER_URI}
lexvay:
  oidc:
    post-login-url: ${LEXVAY_OIDC_POST_LOGIN_URL:/}

---
# `make seed`: load the fictional demo tenants once, then exit. No job polling.
spring:
  config:
    activate:
      on-profile: seed
server:
  port: 0   # the security configuration needs the servlet runtime; a random port avoids clashing with a running server
management:
  server:
    port: -1
lexvay:
  jobs:
    polling-enabled: false
  audit:
    sealing-enabled: false
  seed:
    dir: ${LEXVAY_SEED_DIR:../seed}
    demo-password: ${LEXVAY_DEMO_PASSWORD:lexvay-demo}

---
# `make eval`: seed a fresh tenant, run the pipeline, score it against eval/golden.yml, then exit. No job polling.
spring:
  config:
    activate:
      on-profile: eval
server:
  port: 0
management:
  server:
    port: -1   # like seed: a running development backend must not block the run
lexvay:
  jobs:
    polling-enabled: false
  audit:
    sealing-enabled: false
  seed:
    dir: ${LEXVAY_SEED_DIR:../seed}
  eval:
    dir: ${LEXVAY_EVAL_DIR:../eval}
