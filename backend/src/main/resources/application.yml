spring:
  application:
    name: lexvay
  datasource:
    # The service connects as the application role, which cannot bypass row-level security.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    username: ${LEXVAY_DB_APP_USER:lexvay_app}
    password: ${LEXVAY_DB_APP_PASSWORD:lexvay-app-dev}
  flyway:
    # Migrations run as the schema owner so RLS can be forced on tables the app role does not own.
    url: ${LEXVAY_DB_URL:jdbc:postgresql://localhost:5432/lexvay}
    user: ${LEXVAY_DB_OWNER_USER:lexvay_owner}
    password: ${LEXVAY_DB_OWNER_PASSWORD:lexvay-owner-dev}
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB
      max-request-size: ${LEXVAY_UPLOAD_MAX_MB:25}MB

lexvay:
  filestore:
    type: ${LEXVAY_FILESTORE:local}      # local | s3
    path: ${LEXVAY_FILESTORE_PATH:./data/files}
    s3-bucket: ${LEXVAY_S3_BUCKET:}
  llm:
    provider: ${LEXVAY_LLM_PROVIDER:fake}     # fake | anthropic
    model: ${LEXVAY_LLM_MODEL:claude-sonnet-5-5}
    effort: ${LEXVAY_LLM_EFFORT:medium}       # low | medium | high | xhigh | max
    max-output-tokens: 16000
  matching:
    min-quote-chars: ${LEXVAY_MIN_QUOTE_CHARS:40}
    shortlist-size: 8
  jobs:
    polling-enabled: true
    poll-interval-ms: 1000
    max-attempts: 3

server:
  port: ${LEXVAY_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
