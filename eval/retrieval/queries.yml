  - { id: S09, title: Research, text: coursework in research methods and program evaluation, file: coun635-syllabus.pdf, page: 1, contains: program evaluation methods, searchTerms: ["statistics", "outcome research", "evidence-based practice", "data analysis", "needs assessment", "qualitative methods"] }
