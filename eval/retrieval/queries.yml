# Retrieval queries for `make eval` (ROADMAP F7). Fictional: the requirements are written in the style of licensing
# rules but come from no regulator, and the documents they are asked of (seed/docs and eval/retrieval/docs) do not exist.
#
# Each query is what the matcher sends to the search: a requirement's title and text. The expected answer is one page of
# one document and a substring of the passage that carries the evidence (whitespace-insensitive), so a query is
# recalled when that page is among the top eight and its excerpt coverage is met when the substring is inside the
# excerpt that would be shown to the model. The page numbers are those of the PDFs, which RetrievalFileTest checks.
#
# lexicalGap: true marks a query whose document says the thing in other words than the requirement does (for
# example "marital" against "couples"). Those are reported in their own table and never count toward a threshold:
# they measure what lexical search cannot do. They are not expected to be recalled.
#
# R01-R15 ask for the 13 added syllabi (eval/retrieval/docs), S01-S14 are the matcher's questions of the demo seed,
# G01-G06 are the lexical gaps.
fictional: true
queries:
