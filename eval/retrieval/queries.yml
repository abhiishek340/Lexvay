  - { id: G01, title: Mental and emotional disorders, text: coursework in the diagnosis of mental and emotional disorders, file: coun701-syllabus.pdf, page: 1, contains: classification of psychiatric syndromes, searchTerms: ["psychopathology", "abnormal psychology", "psychiatric disorders", "dsm", "clinical assessment", "mental illness", "diagnostic criteria"], lexicalGap: true }
