# Retrieval queries for `make eval` (ROADMAP F7). Fictional: the requirements are written in the style of licensing
# rules but come from no regulator, and the documents they are asked of (seed/docs and eval/retrieval/docs) do not exist.
#
# Each query is what the matcher sends to the search: a requirement's title and text. The expected answer is one page of
# one document and a substring of the passage that carries the evidence (whitespace-insensitive), so a query is
# recalled when that page is among the top eight and its excerpt coverage is met when the substring is inside the
# excerpt that would be shown to the model. The page numbers are those of the PDFs, which RetrievalFileTest checks.
#
# lexicalGap: true marks a query whose document says the thing in other words than the requirement does (for
# example "marital" against "couples"). Those are reported in their own table and never count toward a threshold:
# they measure what lexical search cannot do. They are not expected to be recalled.
#
# searchTerms (F7c) are what the extraction would propose for the requirement: 3 to 8 words or two-word phrases of the
# vocabulary a syllabus or degree plan uses for the subject, lower-case, none already in the title or text, no state names
# or numbers (RetrievalFileTest runs them through the production normaliser). They are hand-written for the requirement
# alone, as the extraction prompt asks, and were not adjusted after any run: a term list that finds a page it was not
# written for is the measurement, so never edit them to raise a number.
#
# R01-R15 ask for the 13 added syllabi (eval/retrieval/docs), S01-S14 are the matcher's questions of the demo seed,
# G01-G06 are the lexical gaps.
fictional: true
queries:
  # ---- Added syllabi: the evidence is on a long page (page 2, the weekly schedule) or on a short one --------------
  - { id: R01, title: Multicultural counseling, text: coursework in multicultural counseling and social justice advocacy, file: coun705-syllabus.pdf, page: 2, contains: Multicultural counseling competencies and cultural humility, searchTerms: ["cultural diversity", "cross-cultural", "cultural competence", "oppression", "diverse populations"] }
  - { id: R02, title: Counseling theories, text: coursework in the major theories of counseling and psychotherapy, file: coun710-syllabus.pdf, page: 1, contains: major theories of counseling and psychotherapy, searchTerms: ["theoretical orientations", "cognitive behavioral", "psychodynamic", "humanistic", "person-centered", "therapeutic approaches"] }
  - { id: R03, title: Family systems, text: coursework in family systems theory, file: coun715-syllabus.pdf, page: 2, contains: Bowen family systems theory, searchTerms: ["family therapy", "marriage and family", "couples", "systemic", "genogram"] }
  - { id: R04, title: Children and adolescents, text: coursework in counseling children and adolescents, file: coun720-syllabus.pdf, page: 2, contains: Developmental assessment of children and adolescents, searchTerms: ["child development", "youth", "play therapy", "developmental", "school-age"] }
  - { id: R05, title: Counseling skills, text: supervised laboratory practice in counseling skills with recorded sessions, file: coun725-syllabus.pdf, page: 3, contains: three recorded practice sessions, searchTerms: ["skills lab", "role play", "microskills", "video recording", "observation and feedback"] }
  - { id: R06, title: Clinical supervision, text: coursework in models of clinical supervision, file: coun730-syllabus.pdf, page: 2, contains: discrimination model and the developmental model of clinical supervision, searchTerms: ["supervisory relationship", "supervisor", "supervisee", "case consultation", "live observation"] }
  - { id: R07, title: Grief and loss, text: "coursework in grief, bereavement and loss", file: coun735-syllabus.pdf, page: 2, contains: "Grief, bereavement and complicated loss", searchTerms: ["mourning", "death and dying", "end of life", "complicated grief", "hospice"] }
  - { id: R08, title: Human sexuality, text: coursework in human sexuality and gender identity, file: coun740-syllabus.pdf, page: 2, contains: Gender identity and sexual orientation across the lifespan, searchTerms: ["sexual orientation", "gender diversity", "sexual health", "sex therapy", "lgbtq"] }
  - { id: R09, title: Consultation, text: coursework in consultation models and advocacy, file: coun755-syllabus.pdf, page: 2, contains: "Consultation models: mental health, behavioral and process consultation", searchTerms: ["consultant", "collaboration", "systems change", "community outreach", "case management"] }
  - { id: R10, title: Statistics, text: "coursework in statistics, correlation and analysis of variance", file: coun760-syllabus.pdf, page: 2, contains: analysis of variance and post hoc comparisons, searchTerms: ["quantitative methods", "hypothesis testing", "regression", "descriptive statistics", "data analysis"] }
