  # ---- Requirements phrased in the everyday words of a licensing rule, which the policy page of every syllabus also uses ---
  - { id: R12, title: Supervised practice, text: a course in which students practice counseling skills under supervision, file: coun725-syllabus.pdf, page: 2, contains: "Triad practice with counselor, client and observer", searchTerms: ["practicum", "role play", "skills lab", "observation", "feedback", "live supervision"] }
  - { id: R13, title: Research literacy, text: a course in which counseling students learn to read and apply research, file: coun760-syllabus.pdf, page: 3, contains: quantitative study from a counseling journal, searchTerms: ["evidence-based practice", "research methods", "journal articles", "empirical studies", "critical appraisal", "outcome research"] }
