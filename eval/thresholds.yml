# Limits for `make eval` (fake) and `make eval-live` (real model). A run exits non-zero when one is broken.
# Quote verification is not listed: it must be 100 % (product rule 2) and is fixed in code.
#
# fake: the scripted model must reproduce the golden set exactly, so any drift between seed/fake-llm.yml, the
#   pipeline and eval/golden.yml fails the build.
# live: false EVIDENCE_FOUND stays at zero because it is the worst possible error. Recall and extraction
#   agreement are first estimates, to be tightened from real runs; numeric accuracy does not depend on the
#   model once the golden requirement list is substituted.
fake:
  maxFalseEvidenceFoundRate: 0.0
  minRecall: 1.0
  minNumericAccuracy: 1.0
  minExtractionAgreement: 1.0
  minEvidenceAgreement: 1.0
live:
  maxFalseEvidenceFoundRate: 0.0
  minRecall: 0.8
  minNumericAccuracy: 1.0
  minExtractionAgreement: 0.9
  minEvidenceAgreement: 0.8
# retrieval: limits on the BM25 ranker over eval/retrieval/queries.yml, lexical-gap queries excluded. They do not
#   depend on the model. Beyond these floors BM25 may not fall below the ts_rank baseline in recall@8 or recall@3, and BM25
#   with the requirement's search terms (F7c) may not fall below BM25 alone.
# minGapRecallAtDeep: the recall@8 BM25 with search terms must reach on the lexical-gap queries: 4 of the 6, so 0.66
#   (4 / 6 = 0.667 passes, 3 / 6 = 0.5 does not).
retrieval:
  minRecallAtDeep: 0.95
  minExcerptCoverage: 1.0
  minGapRecallAtDeep: 0.66
