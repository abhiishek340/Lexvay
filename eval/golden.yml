# Golden set for the fictional Northfield University seed. Fictional: the rules, courses and findings do not exist.
#
# Written by hand from seed/rules/*.md (what each rule asks) and seed/docs/*.md (what the documents say).
# It does not read seed/fake-llm.yml and must not be generated from it: the two are compared by `make eval`,
# and any drift between them fails the run.
#
# Reading guide
#   finding        What a careful reviewer would expect the system to PROPOSE. The system never determines (rule 1).
#   document       The seed PDF whose text should be cited. Absent when no document supports the requirement.
#   quoteContains  A substring the cited quote must contain (whitespace-insensitive).
#   searchTerms    3 to 8 words or short phrases a syllabus would use for the requirement's subject (what a person
#                  writing the search vocabulary by hand would add). Fictional and written from the requirement text alone.
#                  The live evaluation (`make eval-live`) searches with them and compares them with the terms the model
#                  proposes. Never edit them to raise a number.
#   reason         Why a person would expect this finding. Not used by the runner.
#
# Elective-only coverage is AMBIGUOUS (rule 4): COUN 650, COUN 655 and COUN 645 are electives, and the degree plan makes
# students choose two of them, so no student is certain to have taken the course.
#
# The credit hours of every state are AMBIGUOUS (AC-1, D-590): the rules engine compares the program fact of 60 with the
# fewest credits of the graduation paths, 8 core courses of 3, the clinical sequence of 6 and the cheapest two of three
# electives, 36, and two recorded numbers that differ for one thing are not certain.
fictional: true
requirements:
  # ---- Utah -------------------------------------------------------------------------------------------------
  - { ref: UT-1, jurisdiction: UT, title: Credit hours, text: a graduate degree in counseling of at least 60 semester credit hours, type: NUMERIC, numeric: { field: TOTAL_CREDITS, operator: ">=", value: 60 }, finding: AMBIGUOUS, document: degree-plan.pdf, quoteContains: 60 semester credit hours, searchTerms: [program of study, degree plan, graduation requirements, total credits], reason: "The degree plan states 60 credits and 60 >= 60, but the courses on the cheapest graduation path add up to 36 semester credits (AC-1, D-590): two recorded numbers for one thing, so a person must look." }
  - { ref: UT-2, jurisdiction: UT, title: Ethics coursework, text: coursework in professional ethics and legal standards for counselors, type: SUBJECT, finding: EVIDENCE_FOUND, document: coun605-syllabus.pdf, quoteContains: ACA Code of Ethics, searchTerms: [code of ethics, confidentiality, professional conduct, informed consent], reason: "COUN 605 is a required ethics and legal standards course." }
  - { ref: UT-3, jurisdiction: UT, title: Human growth, text: coursework in human growth and development across the lifespan, type: SUBJECT, finding: EVIDENCE_FOUND, document: coun610-syllabus.pdf, quoteContains: human growth and development across the lifespan, searchTerms: [developmental stages, child and adolescent, aging, developmental theory], reason: "COUN 610 is a required lifespan development course." }
  - { ref: UT-4, jurisdiction: UT, title: Diagnosis, text: coursework in the diagnosis and treatment planning of mental disorders, type: SUBJECT, finding: EVIDENCE_FOUND, document: coun615-syllabus.pdf, quoteContains: formulate diagnoses, searchTerms: [psychopathology, dsm, differential diagnosis, case formulation], reason: "COUN 615 is a required diagnosis and treatment planning course." }
  - { ref: UT-5, jurisdiction: UT, title: Internship hours, text: at least 600 clock hours of supervised internship, type: SUPERVISED_HOURS, numeric: { field: INTERNSHIP_HOURS, operator: ">=", value: 600 }, finding: EVIDENCE_FOUND, document: clinical-handbook.pdf, quoteContains: minimum of 600 clock hours, searchTerms: [clinical placement, supervised clinical experience, site supervisor, field experience], reason: "The clinical handbook states 600 internship hours; 600 >= 600." }
  - { ref: UT-6, jurisdiction: UT, title: Accreditation, text: accredited by a counseling program accrediting body recognized by the board, type: ACCREDITATION, finding: EVIDENCE_FOUND, document: accreditation-letter.pdf, quoteContains: is accredited by the Fictional Accreditation Council, searchTerms: [accreditation council, programmatic accreditation, accreditation status, accreditation term], reason: "The accreditation letter names the accrediting council and its term." }
