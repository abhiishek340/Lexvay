<div class="lx-map" [attr.role]="interactive() ? 'group' : null" [attr.aria-label]="interactive() ? label() : null"
     [attr.aria-hidden]="interactive() ? null : 'true'" (keydown)="onKey($event)">
  @for (cell of cells(); track cell.tile.code) {
    @if (cell.state && interactive()) {
      <button #tileEl type="button" class="lx-tile" [attr.data-code]="cell.tile.code" [attr.data-tile]="cell.state.tile"
              [style.grid-row]="cell.tile.row + 1" [style.grid-column]="cell.tile.col + 1" [style.--lx-col]="cell.tile.col"
              [style.--lx-fill]="share(cell.state)" [tabindex]="tabStop() === cell.tile.code ? 0 : -1" [attr.aria-label]="name(cell)"
              (focus)="onFocus(cell, tileEl)" (blur)="scheduleClose()" (mouseenter)="onEnter(cell, tileEl)" (mouseleave)="scheduleClose()"
              (click)="activate(cell.state)">
        <span class="lx-tile-tint"></span><span class="lx-tile-fill"></span><span class="lx-tile-outcome"></span>
        <span class="lx-tile-code" aria-hidden="true">{{ cell.tile.code }}</span>
      </button>
    } @else {
      <span class="lx-tile" [attr.data-tile]="cell.state?.tile ?? 'NONE'" [style.grid-row]="cell.tile.row + 1" [style.grid-column]="cell.tile.col + 1"
            [style.--lx-col]="cell.tile.col" [style.--lx-fill]="share(cell.state)" aria-hidden="true">
        <span class="lx-tile-tint"></span><span class="lx-tile-fill"></span><span class="lx-tile-outcome"></span>
        <span class="lx-tile-code">{{ cell.tile.code }}</span>
      </span>
    }
  }
</div>

@if (interactive()) {
  <p-popover #card [focusOnShow]="false" [ariaLabel]="previewed()?.name ?? 'State'" styleClass="lx-map-card">
    @if (previewed(); as p) {
      <div class="lx-map-card-body" (mouseenter)="keepOpen()" (mouseleave)="scheduleClose()">
        <lx-progress-ring [size]="40" [value]="p.state.reviewed" [total]="p.state.total || 1"
                          [label]="p.state.reviewed + ' of ' + p.state.total + ' reviewed'">{{ p.state.reviewed }}/{{ p.state.total }}</lx-progress-ring>
        <div class="lx-map-card-text">
          <p class="lx-map-card-name">{{ p.name }}</p>
          <p class="lx-map-card-status" [attr.data-tile]="p.state.tile">
            <ng-icon [name]="statusIcon[p.state.tile]" size="16" aria-hidden="true" />{{ p.state.status }}
          </p>
        </div>
        @if (p.state.action; as a) {
          <a pButton size="small" class="lx-map-card-action" [routerLink]="a.commands" [queryParams]="a.queryParams" (click)="closeCard()">
            <span pButtonLabel>{{ a.label }}</span>
          </a>
        }
      </div>
    }
  </p-popover>
}
