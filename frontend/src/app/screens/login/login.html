<div class="lx-login">
  <p class="lx-login-wordmark">Lexvay</p>
  <h1>Sign in</h1>
  <p class="lx-login-lede">Lexvay sets a program's curriculum beside state licensing rules and records what qualified staff decide. The software proposes; people decide.</p>
  <form (ngSubmit)="submit()" novalidate>
    <div class="lx-field">
      <label for="email">Email</label>
      <input pInputText id="email" name="email" type="email" autocomplete="username" required [(ngModel)]="email" [invalid]="!!error()"
             [attr.aria-describedby]="error() ? 'login-error' : null" fluid />
    </div>
    <div class="lx-field">
      <label for="password">Password</label>
      <p-password inputId="password" name="password" autocomplete="current-password" [feedback]="false" [required]="true" [(ngModel)]="password"
                  [invalid]="!!error()" [fluid]="true" />
    </div>
    @if (error(); as message) {
      <p-message id="login-error" severity="error" size="small" variant="simple">{{ message }}</p-message>
    }
    <p-button type="submit" label="Sign in" [loading]="busy()" [fluid]="true" />
  </form>
</div>
