<section class="login">
  <h1>Sign in to Lexvay</h1>
  <p class="muted">Lexvay compares a program's curriculum with state licensing rules and records what qualified staff decide. The software proposes; people decide.</p>
  <form (ngSubmit)="submit()" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required [(ngModel)]="email" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="password" />
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
    <button type="submit" class="primary" [disabled]="busy()">Sign in</button>
  </form>
</section>
