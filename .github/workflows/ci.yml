name: ci

# One run per change: pushes to main, and pull requests. A newer commit on the same ref cancels the older run.
# The perf job also runs every night and on request; the other jobs only run for changes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  # Pushes to main queue in order and every one completes, so main always has a verdict per commit; a newer push
  # to a pull request cancels the run it supersedes.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Tesseract (OCR test runs against the real binary)
        # Only the Ubuntu archive is needed. Third-party sources preinstalled on the runner image (for example
        # packages.microsoft.com) have answered 403 and failed `apt-get update`, so they are removed first.
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browser
        run: cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Test the stack scripts
        run: make test-scripts

      - name: Run every test suite
        run: make test

      - name: Score the pipeline against the golden set
        run: make eval

  infra:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Validate Terraform (format, validate, offline tests; never plan or apply)
        run: make infra-validate

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image (never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: lexvay:ci-${{ github.sha }}
          build-args: LEXVAY_PRIMEUI_LICENSE=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image size
        run: |
          size=$(docker image inspect "lexvay:ci-${{ github.sha }}" --format '{{.Size}}')
          echo "Image lexvay:ci-${{ github.sha }}: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the image (sign-in, API, metrics, logs, graceful stop)
        run: scripts/smoke.sh "lexvay:ci-${{ github.sha }}"

  # The arbiter of the read-path budget (CLAUDE.md: p95 under 40 ms on the seeded tenant, docs/PERF.md). It needs a quiet
  # runner, which a shared developer machine is not. A pull request runs it only when it changes what the budget
  # measures; the job still passes when it does not, so it can be a required check by convention. Pushes to main report
  # and are never cancelled by a newer one (the concurrency group above).
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this change can move the budget
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -qE '^(backend/src/main/|backend/src/test/java/com/lexvay/perf/|docs/PERF\.md$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under backend/src/main, the perf tests or docs/PERF.md: the budget cannot have moved." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-backend

      - name: Measure the read paths and check the indexes
        if: steps.changes.outputs.run == 'true'
        run: make perf

      # The numbers come from the files the tests write; nothing is recomputed here.
      - name: Publish the numbers
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: |
          {
            echo "## Read-path latency (budget: p95 under 40 ms)"
            echo
            cat backend/target/perf/latency.md 2>/dev/null || echo "The latency test wrote no report."
            echo
            echo "## Index usage (the planner's choice, with the plan of every index it did not use)"
            echo
            cat backend/target/perf/index-usage.md 2>/dev/null || echo "The index test wrote no report."
            echo
            echo "## Audit trail seal (budget: verifying 20 000 entries under 2 s)"
            echo
            cat backend/target/perf/audit-seal.md 2>/dev/null || echo "The audit seal test wrote no report."
            echo
            for report in backend/target/surefire-reports/*.txt; do
              if grep -q "FAILURE" "$report" 2>/dev/null; then
                echo "## Failed: $(basename "$report" .txt)"
                echo
                echo '```'
                grep -v '^\s*at ' "$report" | head -60
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plans
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: backend/target/perf
          retention-days: 14
