name: ci

# One run per change: pushes to main, and pull requests. A newer commit on the same ref cancels the older run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pushes to main queue in order and every one completes, so main always has a verdict per commit; a newer push
  # to a pull request cancels the run it supersedes.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The Maven repository is cached with a prefix fallback: a pom.xml change restores the newest cache and downloads
      # only what changed, instead of everything from Maven Central, which rate-limits busy runners (HTTP 429).
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Tesseract (OCR test runs against the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browser
        run: cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Run every test suite
        run: make test

      - name: Score the pipeline against the golden set
        run: make eval

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Validate Terraform (format, validate, offline tests; never plan or apply)
        run: make infra-validate

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image (never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: lexvay:ci-${{ github.sha }}
          build-args: LEXVAY_PRIMEUI_LICENSE=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image size
        run: |
          size=$(docker image inspect "lexvay:ci-${{ github.sha }}" --format '{{.Size}}')
          echo "Image lexvay:ci-${{ github.sha }}: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the image (sign-in, API, metrics, logs, graceful stop)
        run: scripts/smoke.sh "lexvay:ci-${{ github.sha }}"
