      - { code: COUN 680, title: Applied Research Project, required: true, credits: 6 }   # no syllabus on purpose
    # Creating a course puts it in "Required courses" or "Electives" of the program's catalog year (AC-1, D-588). The degree plan
    # makes students choose two of the three electives, so the seed replaces the electives group by one that says so. The courses
    # add up to the 60 credits of the degree plan: 8 core courses of 3, 9 + 6 + 9 + 6 of clinical and capstone work, 2 electives of 3.
    pathwayGroups:
      - { label: "Electives: choose 2 of 3", kind: CHOOSE_COUNT, minCount: 2, courses: [COUN 645, COUN 650, COUN 655] }
    documents:
      - { file: degree-plan.pdf, kind: DEGREE_PLAN }
      - { file: clinical-handbook.pdf, kind: HANDBOOK }
      - { file: accreditation-letter.pdf, kind: ACCREDITATION }
