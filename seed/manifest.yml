      - { key: PRACTICUM_HOURS, value: 100, document: clinical-handbook.pdf, page: 1, quote: "The practicum requires a minimum of 100 clock hours" }
      - { key: INTERNSHIP_HOURS, value: 600, document: clinical-handbook.pdf, page: 1, quote: "The internship requires a minimum of 600 clock hours" }
