      - { jurisdiction: TX, label: "Demo rule set - Texas (fictional) 2026", sourceUrl: "https://example.invalid/demo/texas", legal: { status: IN_FORCE, adoptedAt: 2026-05-15, publishedAt: 2026-06-01, effectiveFrom: 2026-07-01 }, text: texas.md }
